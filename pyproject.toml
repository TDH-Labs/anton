[project]
name = "harbor-sas"
version = "0.1.0"
description = "Standalone Single-Agent System control plane (greenfield, M1)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "fastapi",
    "uvicorn",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harbor", "harbor.executor"]

[project.scripts]
harbor = "harbor.cli:main"
