[project]
name = "anton"
version = "0.1.0"
description = "Anton: a self-contained automation agent — scheduler, second brain, and a real execution engine, with an Ops Center web UI"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    # Exact pin, not >=: the installed browser binary (Dockerfile's
    # `playwright install chromium`) must match this package version
    # precisely -- bump both together deliberately, same discipline as pi's
    # own pin below.
    "playwright==1.62.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anton", "anton.executor", "anton.authz"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
anton = "anton.cli:main"

