[project]
name = "anton"
version = "0.1.0"
description = "Standalone Single-Agent System control plane (greenfield, M1)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anton", "anton.executor"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
anton = "anton.cli:main"

