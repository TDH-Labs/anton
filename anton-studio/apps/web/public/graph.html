<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; background-color: transparent; overflow: hidden; }
  #graph-box { width: 100vw; height: 100vh; }
</style>
<script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
<div id="graph-box"></div>
<script>
  // Mode comes from the parent app's `data-anton-mode` flag (README, "Son of
  // Anton mode" — a chrome swap driven by one flag), passed as a query
  // param by the embedding page (MemoryScreen.tsx) since this iframe has no
  // access to the parent document. Not the OS color-scheme preference: Son
  // of Anton can be on while the OS is in light mode and vice versa.
  const isSon = new URLSearchParams(location.search).get('mode') === 'son';
  // README, "Data Contracts" / §7 Memory: node kind -> theme color, matching
  // the Design Tokens table (light / Son of Anton).
  const ink = isSon ? '#e9e6df' : '#1d1f20';
  const accent = isSon ? '#f0a020' : '#5980a6';
  const ok = isSon ? '#5fae7d' : '#3f7d55';
  const warn = isSon ? '#f0a020' : '#8a5a10';
  // C = { sys: ok, skill: accent, moc: ink, report: warn }
  const colorForType = (type) => {
    switch (type) {
      case 'sys': return ok;
      case 'skill': return accent;
      case 'moc': return ink;
      case 'report': return warn;
      default: return accent;
    }
  };
  fetch('/api/vault/graph').then(r=>r.json()).then(d=>{
    ForceGraph3D()(document.getElementById('graph-box'))
      .graphData(d)
      .nodeLabel('title')
      .nodeColor(n=>colorForType(n.type))
      .nodeVal('val')
      .linkWidth(1.2)
      .onNodeClick(n => {
        window.parent.postMessage({ type: 'open-node', id: n.id, title: n.title }, '*');
      });
  });
</script>
</body>
</html>
