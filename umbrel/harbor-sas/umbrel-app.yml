manifestVersion: 1
id: harbor-sas
name: Harbor SAS
tagline: Standalone single-agent control plane — scheduler, second brain, initiative engine
icon: assets/icon.svg
category: automation
version: 0.1.0
port: 8799
description: >-
  A self-contained single-agent system control plane: deterministic job scheduling
  (cron + webhooks), an embedded second brain (markdown + SQLite), an initiative engine
  with ambition governor, zero-trust approval gates, usage metering, and a read-only
  dashboard. Executors (pi / Open Interpreter / host SSH) are swappable.
developer: [REDACTED-NAME]
website: https://github.com/ai/harbor-sas
repo: https://github.com/ai/harbor-sas
support: https://github.com/ai/harbor-sas/issues
dependencies: []
gallery: []
releaseNotes: >-
  Initial Umbrel packaging. Set HARBOR_DASHBOARD_TOKEN before exposing the port;
  choose an executor via HARBOR_EXECUTOR (fake | pi | oi | ssh).
