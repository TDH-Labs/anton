manifestVersion: 1
id: anton
name: Anton
tagline: An AI agent for your small business — schedule, memory, and a governor that asks first
icon: assets/icon.svg
category: automation
version: 0.3.0
port: 3080
description: >-
  Anton is an agent, harnessed: point it at the busywork and it does the
  work itself on its own timer, remembering what it's learned along the
  way. It comes with a schedule it actually keeps (cron + webhooks), a
  memory that sticks (markdown + SQLite second brain), and a governor
  standing between "the agent wants to do this" and "this actually
  happens" — so it never spends money, sends something, or touches a new
  account without you saying go first. All of it lives in one browser
  tab, the Ops Center.

  Multi-user safety ships ON by default: role-based access, human
  approval gates for money and outbound messages, an encrypted credential
  broker, and a tamper-evident audit trail. First boot prints a one-time
  Owner claim code to the app logs (visible in the Umbrel log viewer) —
  enter it in the Ops Center to become the owner, then invite teammates
  with scoped roles.
developer: TDH Labs
website: https://github.com/TDH-Labs/anton
repo: https://github.com/TDH-Labs/anton
support: https://github.com/TDH-Labs/anton/issues
dependencies: []
gallery: []
releaseNotes: >-
  Anton now ships its own interface. The vendored third-party UI framework is
  gone, taking its branding with it -- no other company's name or logo
  appears anywhere in the app, and the image is about 2GB smaller. Fixed: the
  Models settings page failed with "settings are unavailable in this browser"
  on every install reached over a network rather than from the machine itself
  (which is every real install).

  New: the Right Now screen shows what Anton is actually working on this
  moment, not just what is scheduled, and lets you steer it -- pause an
  automation, run one now, or skip its next turn. Changes take effect within
  about 15 seconds and never interrupt a job already running.

  Also new: connect Anton to any MCP client (Claude Desktop, Claude Code) to
  check on it and steer it from there, and two ready-made n8n workflows in
  examples/n8n -- an approval gate for anything touching money or outbound
  messages, and an auditor that switches off any workflow trying to skip it.
