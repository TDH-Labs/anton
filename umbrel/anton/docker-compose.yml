services:
  anton:
    image: ghcr.io/tdh-labs/anton:latest
    container_name: anton
    restart: unless-stopped
    ports:
      - "3080:3080"   # docker/auth-gate.mjs — password-gated, the only published port
    volumes:
      - anton_data:/data
    environment:
      - ANTON_EXECUTOR=${ANTON_EXECUTOR:-pi}
      - ANTON_DATA_DIR=/data
      - ANTON_PORT=8799
      - ANTON_SERVE_PORT=8798
      - ANTON_WEB_PORT=3080
      # Login password for the published UI. Leave unset to auto-generate one
      # on first boot (shown once on the login page, then persisted to the
      # data volume) — set it explicitly only if you need a known value.
      - ANTON_WEB_TOKEN=${ANTON_WEB_TOKEN:-}
      - ANTON_DASHBOARD_TOKEN=${ANTON_DASHBOARD_TOKEN:-}
      - ANTON_SSH_HOST=${ANTON_SSH_HOST:-}
      - ANTON_SSH_USER=${ANTON_SSH_USER:-}
      - ANTON_SSH_KEY=${ANTON_SSH_KEY:-}
      - ANTON_SSH_COMMAND=${ANTON_SSH_COMMAND:-}
      # The operator's own n8n instance, if connected (dashboard.py's
      # /api/n8n/config, AutomationsScreen's "Draw it" link, N8NExecutor).
      # A same-Umbrel n8n app is reachable by its container name over
      # Umbrel's shared app network -- e.g. http://n8n_n8n_1:5678 -- find
      # the real name with `docker ps | grep n8n` and set it here. Empty
      # means n8n isn't connected; nothing breaks, "Draw it" just says so.
      - ANTON_N8N_BASE_URL=${ANTON_N8N_BASE_URL:-}
    # Matches the Dockerfile's own HEALTHCHECK -- both call the dashboard's
    # real /health endpoint (returns {"ok": true, "jobs": N}) on its
    # container-internal port, not the auth-gate's public :3080/, which only
    # proves a login page renders, not that the job engine is actually up.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8799/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  anton_data:
